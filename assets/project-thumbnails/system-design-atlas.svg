</defs><text x="24" y="36" font-size="15" fill="#8A9BB5">Interactive system design tutorials</text><rect x="16" y="100" width="128" height="50" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="80.0" y="131.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Rider app</text><rect x="164" y="100" width="128" height="50" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="228.0" y="131.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">API gateway</text><rect x="312" y="100" width="128" height="50" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="376.0" y="131.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Ride service</text><rect x="460" y="100" width="128" height="50" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="524.0" y="131.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Driver match</text><rect x="312" y="200" width="128" height="50" rx="10" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="376.0" y="222.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Surge pricing</text><text x="376.0" y="242.0" text-anchor="middle" font-size="13" fill="#8A9BB5">per map cell</text><rect x="460" y="200" width="128" height="50" rx="10" fill="#0A2230" stroke="#22D3EE" stroke-width="2"/><text x="524.0" y="231.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Location store</text><line x1="144" y1="125" x2="162" y2="125" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#ab)"/><line x1="292" y1="125" x2="310" y2="125" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#ab)"/><line x1="440" y1="125" x2="458" y2="125" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#ab)"/><line x1="376" y1="150" x2="376" y2="198" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#ab)"/><line x1="524" y1="150" x2="524" y2="198" stroke="#22D3EE" stroke-width="1.8" marker-end
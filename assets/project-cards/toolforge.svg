<svg xmlns="http://www.w3.org/2000/svg" width="600" height="356" viewBox="0 0 600 356" role="img" aria-label="ToolForge: Turns any OpenAPI spec into a tested MCP server. How it works: An LLM designs the tools; you approve the plan; A tester agent calls the live API with every tool; A security audit and scorecard close every build. Result: 8 / 8 live tests on PokéAPI, 100 / 100 security score."><title>ToolForge: Turns any OpenAPI spec into a tested MCP server. How it works: An LLM designs the tools; you approve the plan; A tester agent calls the live API with every tool; A security audit and scorecard close every build. Result: 8 / 8 live tests on PokéAPI, 100 / 100 security score.</title><g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="600" height="356" rx="14" fill="#050A14"/><rect x="0.75" y="0.75" width="598.5" height="354.5" rx="13.5" fill="none" stroke="#1E2D45" stroke-width="1.5"/><rect x="0" y="0" width="600" height="6" rx="3" fill="#2F81F7"/><text x="28" y="52" font-size="30" font-weight="700" fill="#E6EDF7" text-anchor="start">ToolForge</text><text x="28" y="84" font-size="17" font-weight="400" fill="#8A9BB5" text-anchor="start">Turns any OpenAPI spec into a tested MCP server</text><circle cx="46" cy="130" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="136" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">1</text><text x="76" y="136" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">An LLM designs the tools; you approve the plan</text><line x1="46" y1="146" x2="46" y2="158" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="174" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="180" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">2</text><text x="76" y="180" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">A tester agent calls the live API with every tool</text><line x1="46" y1="190" x2="46" y2="202" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="218" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="224" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">3</text><text x="76" y="224" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">A security audit and scorecard close every build</text><rect x="28" y="264" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="46" y="298" font-size="24" font-weight="700" fill="#2F81F7" text-anchor="start">8 / 8</text><text x="46" y="321" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">live tests on PokéAPI</text><rect x="308" y="264" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="326" y="298" font-size="24" font-weight="700" fill="#E6EDF7" text-anchor="start">100 / 100</text><text x="326" y="321" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">security score</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Naman: Voice assistant plus a job-search agent team. How it works: Say &quot;Jarvis&quot;: it opens apps, sets reminders, tracks tasks; Agents find jobs, match them and draft applications; Anything risky waits for your OK first. Result: 8 agents running in parallel, Free tiers only, no paid APIs."><title>Naman: Voice assistant plus a job-search agent team. How it works: Say "Jarvis": it opens apps, sets reminders, tracks tasks; Agents find jobs, match them and draft applications; Anything risky waits for your OK first. Result: 8 agents running in parallel, Free tiers only, no paid APIs.</title><g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="600" height="400" rx="14" fill="#050A14"/><rect x="0.75" y="0.75" width="598.5" height="398.5" rx="13.5" fill="none" stroke="#1E2D45" stroke-width="1.5"/><rect x="0" y="0" width="600" height="6" rx="3" fill="#2F81F7"/><text x="28" y="52" font-size="30" font-weight="700" fill="#E6EDF7" text-anchor="start">Naman</text><text x="28" y="84" font-size="17" font-weight="400" fill="#8A9BB5" text-anchor="start">Voice assistant plus a job-search agent team</text><circle cx="46" cy="130" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="136" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">1</text><text x="76" y="136" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">Say "Jarvis": it opens apps, sets reminders,</text><text x="76" y="158" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">tracks tasks</text><line x1="46" y1="146" x2="46" y2="180" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="196" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="202" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">2</text><text x="76" y="202" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">Agents find jobs, match them and draft</text><text x="76" y="224" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">applications</text><line x1="46" y1="212" x2="46" y2="246" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="262" r="15" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="46" y="268" font-size="15" font-weight="700" fill="#2F81F7" text-anchor="middle">3</text><text x="76" y="268" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">Anything risky waits for your OK first</text><rect x="28" y="308" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="46" y="342" font-size="24" font-weight="700" fill="#2F81F7" text-anchor="start">8 agents</text><text x="46" y="365" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">running in parallel</text><rect x="308" y="308" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="326" y="342" font-size="24" font-weight="700" fill="#E6EDF7" text-anchor="start">Free tiers</text><text x="326" y="365" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">only, no paid APIs</text></g></svg>

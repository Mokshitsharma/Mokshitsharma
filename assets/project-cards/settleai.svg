<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="SettleAI: Escrow for work that AI agents hire people to do. How it works: An AI agent posts a job with a signed spending limit; AI checks the worker's photo proof against the job; A rule-based guard approves the PayPal payout, or blocks it. Result: 0 of 8 bad proofs paid, 49 / 49 tampering attempts caught."><title>SettleAI: Escrow for work that AI agents hire people to do. How it works: An AI agent posts a job with a signed spending limit; AI checks the worker's photo proof against the job; A rule-based guard approves the PayPal payout, or blocks it. Result: 0 of 8 bad proofs paid, 49 / 49 tampering attempts caught.</title><g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"><rect width="600" height="400" rx="14" fill="#050A14"/><rect x="0.75" y="0.75" width="598.5" height="398.5" rx="13.5" fill="none" stroke="#1E2D45" stroke-width="1.5"/><rect x="0" y="0" width="600" height="6" rx="3" fill="#F43F5E"/><text x="28" y="52" font-size="30" font-weight="700" fill="#E6EDF7" text-anchor="start">SettleAI</text><text x="28" y="84" font-size="17" font-weight="400" fill="#8A9BB5" text-anchor="start">Escrow for work that AI agents hire people to do</text><circle cx="46" cy="130" r="15" fill="#0B1628" stroke="#F43F5E" stroke-width="2"/><text x="46" y="136" font-size="15" font-weight="700" fill="#F43F5E" text-anchor="middle">1</text><text x="76" y="136" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">An AI agent posts a job with a signed spending</text><text x="76" y="158" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">limit</text><line x1="46" y1="146" x2="46" y2="180" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="196" r="15" fill="#0B1628" stroke="#F43F5E" stroke-width="2"/><text x="46" y="202" font-size="15" font-weight="700" fill="#F43F5E" text-anchor="middle">2</text><text x="76" y="202" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">AI checks the worker's photo proof against the job</text><line x1="46" y1="212" x2="46" y2="224" stroke="#1E2D45" stroke-width="2"/><circle cx="46" cy="240" r="15" fill="#0B1628" stroke="#F43F5E" stroke-width="2"/><text x="46" y="246" font-size="15" font-weight="700" fill="#F43F5E" text-anchor="middle">3</text><text x="76" y="246" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">A rule-based guard approves the PayPal payout, or</text><text x="76" y="268" font-size="17" font-weight="400" fill="#E6EDF7" text-anchor="start">blocks it</text><rect x="28" y="308" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="46" y="342" font-size="24" font-weight="700" fill="#F43F5E" text-anchor="start">0 of 8</text><text x="46" y="365" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">bad proofs paid</text><rect x="308" y="308" width="264" height="70" rx="10" fill="#0B1628" stroke="#1E2D45"/><text x="326" y="342" font-size="24" font-weight="700" fill="#E6EDF7" text-anchor="start">49 / 49</text><text x="326" y="365" font-size="14" font-weight="400" fill="#8A9BB5" text-anchor="start">tampering attempts caught</text></g></svg>

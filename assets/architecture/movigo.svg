<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t">
<title id="t">Movigo high-level architecture: retailer and driver apps feed a core platform of bookings, dispatch and an ML surge-pricing model; an AI voice agent resolves about 81% of support calls and escalates the rest.</title>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}</style>
<rect width="1200" height="400" rx="16" fill="#050A14"/><rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="15.5" fill="none" stroke="#1E2D45" stroke-width="1.5"/><defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F81F7"/></marker>
<marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22D3EE"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F43F5E"/></marker>
</defs><text x="32" y="40" font-size="15" fill="#8A9BB5">Movigo: live B2B intra-city logistics marketplace, Indore. High-level view; the codebase is private.</text><rect x="40" y="90" width="200" height="60" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="140.0" y="117.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Retailer apps</text><text x="140.0" y="137.0" text-anchor="middle" font-size="13" fill="#8A9BB5">book deliveries</text><rect x="40" y="170" width="200" height="60" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="140.0" y="197.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Driver app</text><text x="140.0" y="217.0" text-anchor="middle" font-size="13" fill="#8A9BB5">accept and deliver</text><rect x="40" y="280" width="200" height="60" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="140.0" y="316.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Inbound support calls</text><rect x="330" y="72" width="560" height="176" rx="14" fill="none" stroke="#2F81F7" stroke-width="1.5" stroke-dasharray="6 6"/><text x="350" y="98" font-size="14" font-weight="600" fill="#2F81F7">Core platform, built from zero</text><rect x="350" y="120" width="160" height="60" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="430.0" y="156.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Bookings</text><rect x="530" y="120" width="160" height="60" rx="10" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="610.0" y="147.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Dispatch</text><text x="610.0" y="167.0" text-anchor="middle" font-size="13" fill="#8A9BB5">driver availability</text><rect x="710" y="120" width="160" height="60" rx="10" fill="#0B1628" stroke="#2F81F7" stroke-width="2"/><text x="790.0" y="147.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Surge pricing</text><text x="790.0" y="167.0" text-anchor="middle" font-size="13" fill="#8A9BB5">ML model</text><text x="610" y="222" text-anchor="middle" font-size="13" fill="#8A9BB5">code review: work from 2 full-stack engineers and AI coding tools</text><rect x="530" y="280" width="180" height="60" rx="10" fill="#0A2230" stroke="#22D3EE" stroke-width="2"/><text x="620.0" y="307.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">AI voice agent</text><text x="620.0" y="327.0" text-anchor="middle" font-size="13" fill="#8A9BB5">~81% resolved</text><rect x="960" y="280" width="200" height="60" rx="10" fill="#0B1628" stroke="#1E2D45" stroke-width="1.5"/><text x="1060.0" y="307.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Human support</text><text x="1060.0" y="327.0" text-anchor="middle" font-size="13" fill="#8A9BB5">the rest</text><rect x="960" y="120" width="200" height="60" rx="10" fill="#0A2230" stroke="#22D3EE" stroke-width="2"/><text x="1060.0" y="147.0" text-anchor="middle" font-size="17" font-weight="600" fill="#E6EDF7">Deliveries</text><text x="1060.0" y="167.0" text-anchor="middle" font-size="13" fill="#8A9BB5">across Indore</text><line x1="240" y1="120" x2="348" y2="145" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#mb)"/><path d="M 240 200 H 610 V 184" fill="none" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#mb)"/><line x1="510" y1="150" x2="528" y2="150" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#mb)"/><line x1="690" y1="150" x2="708" y2="150" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#mb)"/><line x1="870" y1="150" x2="958" y2="150" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#mc)"/><line x1="240" y1="310" x2="528" y2="310" stroke="#2F81F7" stroke-width="1.8" marker-end="url(#mb)"/><line x1="710" y1="310" x2="958" y2="310" stroke="#F43F5E" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#mr)"/><text x="834" y="300" text-anchor="middle" font-size="12" fill="#F43F5E">escalate</text>
